{% extends "admin/base.html" %}

{% block title %}
Add Course
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-header">
                <h4 class="mb-0">Add Course</h4>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Course Code
                        </label>

                        <input
                            type="text"
                            name="code"
                            class="form-control"
                            placeholder="e.g. CSC 401"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Course Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="e.g. Artificial Intelligence"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Course Units
                        </label>

                        <input
                            type="number"
                            name="units"
                            class="form-control"
                            min="1"
                            max="10"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Course Type
                        </label>

                        <select
                            name="course_type"
                            class="form-select"
                        >

                            <option value="Theory">
                                Theory
                            </option>

                            <option value="Practical">
                                Practical
                            </option>

                            <option value="Laboratory">
                                Laboratory
                            </option>

                            <option value="Seminar">
                                Seminar
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Level
                        </label>

                        <select
                            name="level_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                -- Select Level --
                            </option>

                            {% for level in levels %}

                            <option value="{{ level.id }}">
                                {{ level.name }}
                                -
                                {{ level.programme.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Course
                        </button>

                        <a
                            href="{{ url_for('courses.index') }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
